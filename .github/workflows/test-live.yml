name: Contract tests (live, read-only)

on:
  push:
    branches: [main]

jobs:
  test-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Run contract tests against the live deployment (GET-only)
        working-directory: tests
        env:
          LIVE_OWNER_EMAIL: ${{ secrets.LIVE_OWNER_EMAIL }}
          LIVE_OWNER_PASSWORD: ${{ secrets.LIVE_OWNER_PASSWORD }}
        run: npm run test:live

      - name: Send results to TestMind
        if: always()
        working-directory: tests
        env:
          TESTMIND_INGEST_URL: ${{ secrets.TESTMIND_INGEST_URL }}
          TESTMIND_API_KEY: ${{ secrets.TESTMIND_API_KEY }}
        run: npm run send-results -- live

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: tests/playwright-report/
          retention-days: 14
