name: Generate tests on contract drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Check for contract drift
        id: drift
        working-directory: tests
        run: |
          if npm run check-drift; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code
        if: steps.drift.outputs.drift == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate/update contract, DB-integrity, and security tests for the drifted endpoints
        if: steps.drift.outputs.drift == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="testmind/update-tests-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          claude -p "The live OpenAPI contract at https://zoofyautomation.norwen.nl/openapi.json has drifted from the committed snapshot at tests/contracts/openapi-snapshot.json. Run 'cd tests && npm run check-drift' to see exactly which paths were added or removed. Do the following for the drifted endpoints: 1) Write or update a Playwright TypeScript contract test under tests/contracts/, following the exact pattern already used in tests/contracts/subscription-invoices.spec.ts: derive scenarios from the live contract (tests/helpers/contract.ts), validate response bodies against the live OpenAPI schema with AJV (tests/helpers/schema.ts), authenticate with the fixtures in tests/fixtures/auth.ts (ownerApi for GET, apiKeyHeaders for POST), and wrap any mutating test in a 'mutations (mock only)' describe block that skips on the live project. Cover happy path, missing/invalid auth, validation errors, and upsert/dedup behavior where applicable, matching the depth of the existing spec. 2) If the drift introduces a genuinely NEW database table/resource (not just a new field or endpoint on a resource already covered under backend/tests/), add a DB-integrity pytest suite under backend/tests/, following the exact pattern in backend/tests/test_constraints.py and backend/tests/test_upsert_logic.py: call the FastAPI route functions directly against a real Postgres (bypassing HTTP), covering the resource's unique constraint(s) (read them from backend/app/models.py) and its actual upsert/retry-safety behavior (read the matching router in backend/app/routers/ — it may be ON CONFLICT DO NOTHING, DO UPDATE, or fill-only-NULL). Skip this step if the resource is already covered there. 3) If the drift introduces a new mutating endpoint, add it to the 'endpoints' array in the invalid-X-API-Key test in tests/security/security.spec.ts, and if it accepts free-text string fields, add SQL-injection-shaped and script-tag-shaped storage tests for it following the existing injection tests in that file. If the drift introduces a new GET list endpoint, add its path to the loop in tests/nonfunctional/latency.spec.ts. Do NOT modify tests/contracts/openapi-snapshot.json — that is updated separately, only after this PR merges, via the update-snapshot workflow." \
            --dangerously-skip-permissions \
            --output-format text

          git add tests/contracts/*.spec.ts tests/security/security.spec.ts tests/nonfunctional/latency.spec.ts backend/tests/*.py
          if git diff --cached --quiet; then
            echo "No test file changes were generated — nothing to open a PR for."
            exit 0
          fi

          git commit -m "Add/update contract, DB-integrity, and security tests for drifted API endpoints (auto-generated)"
          git push origin "$BRANCH"
          PR_BODY=$'Auto-generated by generate-tests.yml after detecting drift between the live /openapi.json and the committed snapshot (tests/contracts/openapi-snapshot.json).\n\nMay include Playwright contract tests (tests/contracts/), a DB-integrity pytest suite for a genuinely new resource (backend/tests/), and/or updates to the shared security/latency checks (tests/security/, tests/nonfunctional/) — review which layers actually changed before merging. This PR never touches the committed snapshot. After merging, "Update contract snapshot" now runs automatically (see update-snapshot.yml).'
          gh pr create \
            --title "Update tests for API changes" \
            --base main \
            --head "$BRANCH" \
            --body "$PR_BODY"
