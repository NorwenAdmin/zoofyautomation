name: Contract tests (mock)

on:
  pull_request:
    branches: [main]

jobs:
  test-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Run contract tests against the throwaway mock stack
        working-directory: tests
        run: npm run test:mock

      - name: Send results to TestMind
        if: always()
        working-directory: tests
        env:
          TESTMIND_INGEST_URL: ${{ secrets.TESTMIND_INGEST_URL }}
          TESTMIND_API_KEY: ${{ secrets.TESTMIND_API_KEY }}
        run: npm run send-results -- mock

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: tests/playwright-report/
          retention-days: 14

  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zoofyautomation
          POSTGRES_PASSWORD: zoofyautomation
          POSTGRES_DB: zoofyautomation
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U zoofyautomation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply schema
        run: PGPASSWORD=zoofyautomation psql -h localhost -p 5437 -U zoofyautomation -d zoofyautomation -f backend/db/init.sql

      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt

      - name: Run DB integrity tests (US-5) — direct against Postgres, not through HTTP
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://zoofyautomation:zoofyautomation@localhost:5437/zoofyautomation
        run: python -m pytest tests/ -v
