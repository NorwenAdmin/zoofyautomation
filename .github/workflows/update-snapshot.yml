name: Update contract snapshot

# Two ways to run this:
# 1. workflow_dispatch — manual, for after a deploy you want to confirm before bumping the
#    baseline yourself.
# 2. Automatically, when a PR from generate-tests.yml (branch testmind/update-tests-*) merges
#    into main. This is safe specifically because check-drift.ts compares against the LIVE
#    server, not git — if that PR's drift was detected at all, the underlying change was
#    already live at detection time. A human merging the generated tests is the signal that
#    coverage for that drift is now acceptable, so the baseline can move.
# Deliberately NOT triggered on every push/deploy: bumping the snapshot before generate-tests.yml
# ever sees the drift would erase it before an AI-drafted test gets a chance to exist.
on:
  workflow_dispatch: {}
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'testmind/update-tests-'))
    runs-on: ubuntu-latest
    steps:
      # Explicit ref: on a closed pull_request event, checkout's default resolves to a PR-merge
      # ref, not necessarily main's actual current tip after the merge landed.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Snapshot the live OpenAPI contract
        working-directory: tests
        run: npm run snapshot-openapi -- https://zoofyautomation.norwen.nl

      - name: Open and auto-merge a PR if the snapshot changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/contracts/openapi-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot already up to date."
            exit 0
          fi

          # main is branch-protected (required status check + no direct push, even for the
          # Actions bot's admin-owned token) — a mechanical, single-file, generated-content
          # change like this snapshot doesn't need human review, so open a PR and merge it
          # immediately once its own required check passes.
          BRANCH="testmind/update-snapshot-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git commit -m "Update OpenAPI contract snapshot"
          git push origin "$BRANCH"
          gh pr create --title "Update OpenAPI contract snapshot" --base main --head "$BRANCH" \
            --body "Auto-generated by update-snapshot.yml — mechanical snapshot bump, no test files touched."
          gh pr merge "$BRANCH" --squash --delete-branch --auto
