<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoofy Automation</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="login-view" class="view">
    <form id="login-form" class="login-form">
      <h1>Zoofy Automation</h1>
      <input type="email" id="email" placeholder="Email" required autocomplete="username" />
      <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password" />
      <button type="submit">Войти</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app-view" class="view" hidden>
    <header>
      <h1>Zoofy Automation</h1>
      <button id="logout-btn">Выйти</button>
    </header>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="subscriptions">Подписка Zoofy</button>
      <button class="tab-btn" data-tab="appointments">График работ</button>
      <button class="tab-btn" data-tab="facturen">Facturen</button>
    </nav>
    <main>
      <section id="tab-subscriptions" class="tab-panel">
        <table id="subscriptions-table">
          <thead>
            <tr>
              <th>Factuur</th>
              <th>Kenmerk</th>
              <th>Factuurdatum</th>
              <th>Vervaldatum</th>
              <th>Сумма</th>
              <th>Письмо</th>
              <th>PDF</th>
            </tr>
          </thead>
          <tbody id="subscriptions-body"></tbody>
        </table>
        <p id="subscriptions-empty" class="empty-state" hidden>Пока нет записей.</p>
      </section>

      <section id="tab-appointments" class="tab-panel" hidden>
        <table id="appointments-table">
          <thead>
            <tr>
              <th>Klusnummer</th>
              <th>Klus</th>
              <th>Дата</th>
              <th>Начало</th>
              <th>Конец</th>
              <th>Статус</th>
              <th>Письмо</th>
            </tr>
          </thead>
          <tbody id="appointments-body"></tbody>
        </table>
        <p id="appointments-empty" class="empty-state" hidden>Пока нет записей.</p>
      </section>

      <section id="tab-facturen" class="tab-panel" hidden>
        <table id="facturen-table">
          <thead>
            <tr>
              <th>Factuur</th>
              <th>Klant</th>
              <th>Klusnummer</th>
              <th>Klusomschrijving</th>
              <th>Klusadres</th>
              <th>Factuurdatum</th>
              <th>Vervaldatum</th>
              <th>Totaal</th>
              <th>Письмо</th>
              <th>PDF</th>
            </tr>
          </thead>
          <tbody id="facturen-body"></tbody>
        </table>
        <p id="facturen-empty" class="empty-state" hidden>Пока нет записей.</p>
      </section>
    </main>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
