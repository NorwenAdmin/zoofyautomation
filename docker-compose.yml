services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: zoofyautomation
      POSTGRES_PASSWORD: zoofyautomation
      POSTGRES_DB: zoofyautomation
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
